<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랜덤 캐릭터 생성기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="stage">
      <div class="preview-wrap">
        <div id="preview" class="preview" aria-label="캐릭터 미리보기"></div>
        <!-- 휴대폰에서만 보이는 카드 위 버튼 (카드 아래 버튼 대신) -->
        <div class="card-tools left">
          <button id="ico-random" class="ico" type="button" aria-label="랜덤" title="랜덤"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.5v5.5H16"/><path d="M2.5 19.5V14H8"/><path d="M4.4 9.5A8 8 0 0 1 17.6 6.3L21.5 10M2.5 14l3.9 3.7a8 8 0 0 0 13.2-3.2"/></svg></button>
        </div>
        <div class="card-tools right">
          <button id="ico-prev" class="ico" type="button" aria-label="이전 캐릭터" title="이전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/></svg></button>
          <button id="ico-show" class="ico" type="button" aria-label="자랑 게시판에 올리기" title="자랑하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
          <button id="ico-copy" class="ico" type="button" aria-label="이미지 복사" title="이미지 복사"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg></button>
        </div>
        <p id="status" class="toast" role="status"></p>
      </div>

      <div class="actions">
        <button id="btn-random" class="primary" type="button" title="단축키: 스페이스">랜덤</button>
        <button id="btn-prev" type="button" title="이전 캐릭터 (←)">이전</button>
        <button id="btn-next" type="button" title="다음 캐릭터 (→)">다음</button>
      </div>

      <div class="actions four">
        <button id="btn-png" type="button">PNG 저장</button>
        <button id="btn-svg" type="button">SVG 저장</button>
        <button id="btn-copy-image" type="button" title="왼쪽 위에 dovemayo.com 이 작게 들어간 이미지를 복사합니다">이미지 복사</button>
        <button id="btn-show" type="button" title="자랑 게시판에 이 캐릭터를 올립니다">자랑하기</button>
      </div>

      <div id="build-bar" class="build-bar" hidden>
        <button id="btn-build" type="button">빌드</button>
        <button id="btn-items" type="button">항목 편집</button>
        <span id="build-status" class="status">parts 폴더를 저장하면 자동으로 빌드됩니다.</span>
      </div>

      <div class="code">
        <label for="code">조합 코드</label>
        <div class="code-row">
          <input id="code" type="text" spellcheck="false" autocomplete="off">
          <button id="btn-copy" type="button">복사</button>
          <button id="btn-apply" type="button">적용</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <header class="panel-head">
        <h1>랜덤 캐릭터 생성기</h1>
        <a class="repo" href="https://dovemayo.com/">dovemayo.com</a>
        <a class="repo" href="https://dovemayo.com/character/show/">자랑 게시판</a>
        <a class="repo" href="https://dovemayo.com/character/board/">제안 게시판</a>
      </header>
      <div id="groups"></div>
    </aside>
  </main>

  <dialog id="items-dialog" class="items-dialog">
    <form method="dialog" class="items-head">
      <h2>항목 편집</h2>
      <select id="items-cat" aria-label="항목"></select>
      <button id="items-folder" type="button">폴더 열기</button>
      <button value="close" aria-label="닫기">닫기</button>
    </form>
    <p class="items-help">이름·순서·랜덤 비중을 고치고 저장하세요. 파일을 폴더에 넣거나 빼도 다음 빌드 때 목록이 자동으로 맞춰집니다.</p>
    <div class="items-table-wrap">
      <table class="items-table">
        <thead><tr><th>순서</th><th>이름</th><th>파일</th><th>비중</th><th>기본</th><th></th></tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
    <div class="items-foot">
      <span id="items-status" class="status"></span>
      <button id="items-save" type="button" class="primary">저장</button>
    </div>
  </dialog>

  <script src="js/core.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/parts-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
